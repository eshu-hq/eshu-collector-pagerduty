# Activation config for one PagerDuty account. The Eshu component-extension
# host reads this file; `host` and `process` configure the host, and everything
# under `config` reaches the collector as the Request config.
#
# Every host and identifier below is a placeholder. The API token is never
# written here: `token_env` names the environment variable the collector
# process reads it from.
host:
  sourceSystem: pagerduty
  scope:
    id: pagerduty:account:example-account
    kind: pagerduty_account
process:
  command: /opt/eshu/components/dev.eshu.collector.pagerduty/collector
  # Raise this together with config.max_result_bytes if a large account needs
  # more than the 4 MiB default result.
  stdout_limit_bytes: 4194304
config:
  # Must equal host.scope.id; a claim for any other scope fails terminal.
  scope_id: pagerduty:account:example-account
  account_id: example-account
  token_env: ESHU_PAGERDUTY_API_TOKEN
  # Optional. Defaults to https://api.pagerduty.com.
  # api_base_url: https://api.pagerduty.com
  # Optional credential-free URI recorded as the fallback source reference.
  # source_uri: https://example.pagerduty.com
  incident_lookback: 6h
  # Page sizes (0 selects the PagerDuty default, maximum 100).
  incident_limit: 100
  log_entry_limit: 100
  change_event_limit: 100
  # Pagination bounds per list: stop after this many pages or records and emit
  # a truncation coverage warning when the provider still had more.
  pagination_max_pages: 10
  pagination_max_records: 1000
  # Read only these services, instead of every service in the account.
  # allowed_service_ids: [PEXAMPL]
  # Also read live service and integration configuration.
  config_validation_enabled: false
  config_resource_limit: 100
  # Fail terminal with result_too_large above this many encoded bytes.
  max_result_bytes: 3500000
  # allow_empty_successor is unsupported until the collector SDK carries
  # Generation.TrustedDeletion; setting it true fails closed.
