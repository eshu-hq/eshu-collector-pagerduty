#
# Publishes the collector image when a v* tag is pushed. It never runs on a
# pull request or a branch push, so nothing is published before a tag exists.
# The only credential is the job's GITHUB_TOKEN. There is no deploy step: the
# job records the digest in its summary, and a person copies that digest into
# the activation's seed.image (see README, "Releasing").
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned to commit SHAs; the comment names the release.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: eshu-hq/eshu-collector-pagerduty
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require the tag to match the manifest version
        run: |
          version="$(awk '/^  version:/ {print $2; exit}' manifest.yaml)"
          test -n "${version}"
          test "v${version}" = "${TAG_NAME%%-*}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the linux/amd64 image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/eshu-hq/eshu-collector-pagerduty:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

      - name: Record the digest in the job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Tag: \`${TAG_NAME}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Set the activation's \`seed.image\` to \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/eshu-hq/eshu-collector-pagerduty
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image digest (keyless)
        env:
          IMAGE_REF: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Verify the signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Generate the image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: eshu-collector-pagerduty.spdx.json
          artifact-name: eshu-collector-pagerduty.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/eshu-hq/eshu-collector-pagerduty
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: eshu-collector-pagerduty.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Require the package to be public
        env:
          IMAGE_REF: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: |
          # A fresh Docker config carries no registry credentials, so this
          # pull is anonymous. The activation pulls the image without a token.
          anonymous="$(mktemp -d)"
          if ! DOCKER_CONFIG="${anonymous}" docker buildx imagetools inspect "${IMAGE_REF}" > /dev/null; then
            echo "::error::The package is not publicly readable. Set the package visibility to public, then re-run this job."
            exit 1
          fi
