#
# Publishes the collector image on every push to main and on every pushed
# version tag. Nothing runs on a pull request, and nothing here deploys.
# A v* tag push publishes that tag after the tag-shape, protected-main-head,
# and manifest-version guards pass; those guards run only on tag events. A
# push to main publishes the moving main, latest, and sha-<full-sha> tags with
# the same provenance, signature, SBOM, and attestation hardening as
# version-tag releases.
# The only credential is the job's GITHUB_TOKEN. There is no deploy step: the
# job records the digest in its summary, and a person copies that digest into
# the activation's seed.image (see README, "Releasing").
name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs; the comment names the release.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      # The tag only reaches the shell through TAG_NAME. A tag that is not a
      # clean semantic version fails here, before any checkout or build.
      - name: Require a semantic version tag
        if: github.ref_type == 'tag'
        run: |
          if ! printf '%s' "${TAG_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag '${TAG_NAME}' is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi

      # No later step pushes to the repository, so the checkout keeps no
      # token in the work tree.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tagged commit must be the head of main, so a tag cut from a branch
      # or an older commit cannot publish an image.
      - name: Require the tag to point at the protected main head
        if: github.ref_type == 'tag'
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main --quiet
          main_head="$(git rev-parse origin/main)"
          if [[ "${TAG_COMMIT}" != "${main_head}" ]]; then
            echo "tag '${TAG_NAME}' points at ${TAG_COMMIT}, not the protected main head ${main_head}" >&2
            exit 1
          fi

      - name: Require the tag to match the manifest version
        if: github.ref_type == 'tag'
        run: |
          version="$(awk '/^  version:/ {print $2; exit}' manifest.yaml)"
          test -n "${version}"
          test "v${version}" = "${TAG_NAME%%-*}"

      # The tagged commit's time pins the image's created time, so a re-run of
      # this job for the same tag does not stamp a different one.
      - name: Compute the source date epoch
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tag events)
        id: meta-tag
        if: github.ref_type == 'tag'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Extract image metadata (main-branch pushes)
        id: meta-branch
        if: github.ref_type == 'branch'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push the linux/amd64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          tags: |
            ${{ steps.meta-tag.outputs.tags }}
            ${{ steps.meta-branch.outputs.tags }}
          labels: |
            ${{ steps.meta-tag.outputs.labels }}
            ${{ steps.meta-branch.outputs.labels }}

      - name: Record the digest in the job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Tag: \`${TAG_NAME}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Set the activation's \`seed.image\` to \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/eshu-hq/eshu-collector-pagerduty
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image digest (keyless)
        env:
          IMAGE_REF: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Verify the signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Generate the image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: eshu-collector-pagerduty.spdx.json
          artifact-name: eshu-collector-pagerduty.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/eshu-hq/eshu-collector-pagerduty
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: eshu-collector-pagerduty.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: |
          # actions/attest names the SBOM predicate after the file's own
          # spdxVersion ("SPDX-2.3" becomes .../Document/v2.3), so read it
          # from the file instead of assuming a version.
          spdx_version="$(jq -r '.spdxVersion // empty' eshu-collector-pagerduty.spdx.json)"
          case "${spdx_version}" in
            SPDX-[0-9]*) ;;
            *)
              echo "::error::The SBOM has no usable spdxVersion (got '${spdx_version}')."
              exit 1
              ;;
          esac
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}" \
            --predicate-type "https://spdx.dev/Document/v${spdx_version#SPDX-}"

      - name: Require the package to be public
        env:
          IMAGE_REF: ghcr.io/eshu-hq/eshu-collector-pagerduty@${{ steps.build.outputs.digest }}
        run: |
          # A fresh Docker config carries no registry credentials, so this
          # pull is anonymous. The activation pulls the image without a token.
          anonymous="$(mktemp -d)"
          if ! DOCKER_CONFIG="${anonymous}" docker buildx version > /dev/null 2>&1; then
            echo "::error::docker buildx is unavailable under an empty Docker config, so the anonymous-pull check could not run."
            exit 1
          fi
          if ! output="$(DOCKER_CONFIG="${anonymous}" docker buildx imagetools inspect "${IMAGE_REF}" 2>&1)"; then
            # Only an access refusal means the package is private. Any other
            # failure (network, registry outage) says so instead.
            if printf '%s' "${output}" | grep -Eqi 'unauthorized|denied|forbidden'; then
              echo "::error::The package is not publicly readable. Set the package visibility to public, then re-run this job."
            else
              echo "::error::The anonymous-pull check failed for a reason other than access: ${output}"
            fi
            exit 1
          fi
