name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .

  ci-complete:
    if: always()
    needs: [vet, test, boundary]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          test "${{ needs.vet.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.boundary.result }}" = "success"
