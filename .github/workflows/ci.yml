# CI gates for eshu-collector-pagerduty (org gate contract).
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned by
# commit SHA below, tag only as a trailing comment). This file holds the
# paths-filter `changes` job, the `go-ci` call with this repo's run-gate
# wiring, the two caller-side jobs the reusable cannot own (scheduled
# findings issue, Security-tab SARIF upload), and the `ci-complete`
# aggregator. ci-complete is the ONLY context the main ruleset requires: it
# fails if a needed lane failed and passes when lanes were legitimately
# skipped (docs-only PRs). Lane names inside the reusable are unchanged
# (lint, test, race, boundary, shell, image, govulncheck, gosec, actionlint);
# their check runs nest as `go-ci / <lane>`, which is why only the
# top-level ci-complete may ever be required.
#
# Path selection happens once, in `changes` (dorny/paths-filter), on every
# event. A PR only pays for lanes its paths can affect:
#   docs only (**/*.md, LICENSE*) .... no lanes, ci-complete succeeds
#   Go sources (**/*.go) ............. lint, test, race, boundary (+ coverage),
#                                      image, gosec
#   fixtures (**/*.json|yaml|yml,
#     *.example.*) ................... test only, unless go also matches
#   testdata/**, manifest.yaml ....... go class: lint, test, race, boundary,
#                                      image, gosec (compiled or embedded)
#   go.mod/go.sum/.golangci.yml ...... lint, test, race, boundary, image,
#                                      govulncheck, gosec
#   .github/workflows/**,
#     .github/dependabot.yml ......... actionlint plus lint, test, race,
#                                      boundary, gosec
#   shell (**/*.sh) .................. shell only
#   Dockerfile, .dockerignore ........ image only
#   anything else (Makefile, ...):
#     the `misc` catch-all runs lint, test, race, boundary (fail closed).
# Pushes, schedules, and dispatches run every lane: each run-* gate
# short-circuits on `github.event_name != 'pull_request'`. Each gate below is
# the exact retired inline `if:` with `always() && needs.changes.result !=
# 'success'` (true on every non-PR event, when `changes` used to be skipped)
# replaced by that event test.
#
# Fixture entries are test-consumed (proven 2026-10-28 by rg):
#   testdata/**       fixtures_test.go (testdata/fixtures),
#                     parity_test.go (testdata/parity/cases.json,
#                     testdata/golden/*.json),
#                     testhelpers_test.go (testdata/source/*.json),
#                     boundary_test.go (skips testdata dir walk)
#   **/*.json         grant_test.go (grant.example.json),
#                     parity/conformance (testdata/**/*.json)
#   **/*.yaml|yml     testhelpers_test.go (manifest.yaml),
#                     config_example_test.go (config.example.yaml),
#                     manifest_test.go + manifest_embed.go go:embed
#                     (manifest.yaml),
#                     release_workflow_test.go (.github/workflows/release.yml)
#   manifest.yaml     manifest_embed.go go:embed, testhelpers_test.go
#                     loadManifest, cmd/collector seed tests
#   *.example.*       config_example_test.go (config.example.yaml),
#                     grant_test.go (grant.example.json)
# Shell: scripts/run-conformance.sh is a local helper no test executes
# (rg finds no .sh reader in Go tests), so a shell-only PR runs shell
# only (no test).
#
# Pinned actions (re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (passed as reusable inputs so the move neither downgrades nor
# silently upgrades a scanner; Dependabot cannot see them, bump deliberately):
#   golangci-lint v2.12.2, govulncheck v1.9.0, gosec v2.30.0 (the reusable
#   defaults to v2.27.1), actionlint 1.7.12 (tarball sha256 8aca8db9...
#   verified against the linux_amd64 release asset).
#
# Accepted deltas of the move to the reusable (documented, not silent):
# - Lane timeouts follow the reusable: test 10 (was 15), race 15 (was 20),
#   shell 5 (was 10), gosec 30 (was 15). A reusable-call job cannot set
#   timeout-minutes, so the inner timeouts bound the call.
# - actionlint is its own lane (was a step inside lint), with the same
#   gate; it runs `actionlint -no-color .github/workflows/*.yml` from the
#   sha256-checked tarball instead of `go install`.
# - golangci-lint is `go install`ed then run (was `go run ...@version`),
#   same version. The tidy step also fails on a dirty go.mod/go.sum.
# - govulncheck runs `-scan package` (Go 1.26 SSA-safe; was source-mode
#   `govulncheck ./...`): it reports vulnerable packages whether or not the
#   symbol is reached, so it can flag more than before.
# - shellcheck comes from ludeeus/action-shellcheck pinned by SHA inside
#   the reusable; the repo's SHELLCHECK_VERSION 0.11.0 / sha256 pins have no
#   input and retire with this move.
# - The race lane's per-package coverage table is the reusable's
#   `go tool cover -func | tail -n 30` summary; the floor (90.8) still
#   fails the lane below it and is held equal to the Makefile by
#   TestCoverageFloorParity. The artifact is coverage-pagerduty (was
#   coverage-<sha>).
# - gosec stays advisory on every event (gosec-fail-on-findings: false),
#   as before, but the reusable's lane fails if gosec.sarif is missing
#   (the retired lane stayed green). The SARIF artifact is gosec-pagerduty
#   (was gosec-<sha>) and now carries gosec.log too; the Security-tab upload
#   stays in the gosec-sarif caller job, which runs on non-PR events
#   whenever go-ci was not cancelled.
# - The reusable keeps no govulncheck report artifact. On a schedule event
#   every lane runs, and a failed go-ci (govulncheck findings included) is
#   now a red scheduled run that files or updates one issue through the
#   govulncheck-report job (job name unchanged, title is now generic). The
#   findings text is no longer embedded in the issue body (the run link is),
#   and the workflow_dispatch download-only proof of that job is gone.
#   The retired issue lookup passed a nonexistent `--query` flag to
#   `gh issue list`; the lookup now uses --jq.
# - Image digest-pin proofs are NEW gates in the image-command hook (tempo
#   parity): every manifest.yaml `image:` line and every Dockerfile FROM
#   must be digest-pinned. Both hold in this repo today
#   (TestRepoFilesSatisfyImagePinProofs).
# - `changes` now runs on every event; a failed `changes` skips go-ci and
#   trips ci-complete directly (it is in ci-complete's needs).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# The reusable requests contents: read, and a called workflow can never hold
# more than its caller, so the workflow default cannot be {} any more. Jobs
# that need less (ci-complete) narrow it back to none.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Runs on every event on purpose, with no if: guard: every lane needs
    # this job, so skipping it on push or schedule drags all lanes to
    # skipped and the run goes vacantly green. On non-PR events the filter
    # outputs go unused (each run-* gate short-circuits on the event).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      deps: ${{ steps.filter.outputs.deps }}
      workflow: ${{ steps.filter.outputs.workflow }}
      shell: ${{ steps.filter.outputs.shell }}
      image: ${{ steps.filter.outputs.image }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            docs:
              - '**/*.md'
              - 'LICENSE*'
            go:
              # Go sources plus everything compiled or embedded into the
              # binary: **/*.go (lint, test, race, boundary judge the code
              # itself), testdata/** (fixture .go.txt files plus the JSON
              # golden files and cassettes the conformance, parity, and
              # replay tests open), manifest.yaml (go:embed'ed via
              # manifest_embed.go), and the module and lint inputs.
              - '**/*.go'
              - 'testdata/**'
              - 'manifest.yaml'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Files tests open that are NOT in the go class: the root
              # example fixtures (grant_test.go reads grant.example.json,
              # config_example_test.go reads config.example.yaml) plus the
              # YAML/JSON globs for future fixtures. testdata/** and
              # manifest.yaml also match these globs, but the go class wins
              # for lane routing, so a root-JSON-only PR runs test only
              # while a testdata PR runs lint, test, race, boundary.
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflow:
              # CI configuration: workflow files plus the Dependabot config
              # (no test reads it, so it is not fixtures-class, and the
              # misc catch-all negates **/*.yml — without this entry a
              # Dependabot-config PR would run no lane at all).
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            misc:
              # Fail closed per the epic: anything not classified above runs
              # lint+test+race+boundary. Docs stay negated so docs-only PRs
              # keep skipping every lane; every classified pattern is negated
              # too so narrow lanes (fixtures/shell/image) keep their shape.
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!**/*.go'
              - '!testdata/**'
              - '!manifest.yaml'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!**/*.json'
              - '!**/*.yaml'
              - '!**/*.yml'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  go-ci:
    needs: [changes]
    # No timeout-minutes here: a reusable-call job accepts only name/uses/
    # with/secrets/needs/if/permissions (actionlint rejects the file
    # otherwise), so the run ceiling lives in the upstream inner-lane
    # timeouts (lint/image 15, race 15, test/boundary/govulncheck 10,
    # gosec 30, shell/actionlint 5).
    permissions:
      contents: read
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: pagerduty
      go-version-file: go.mod
      coverage-floor: 90.8
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true' }}
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true' }}
      run-boundary: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true' }}
      boundary-command: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' }}
      # Go sources ship in the image (the Dockerfile COPYs go.mod/go.sum and
      # the whole context, then go-builds the binary), so Go-class PRs must
      # select the image lane: a go.mod toolchain bump past the pinned base
      # would otherwise pass every Go lane yet break docker build.
      run-image: ${{ github.event_name != 'pull_request' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' }}
      image-tag: eshu-collector-pagerduty:ci
      image-context: .
      image-command: |
        set -euo pipefail
        seed="$RUNNER_TEMP/pagerduty-seed"
        mkdir -p "$seed" && chmod 777 "$seed"
        docker run --rm -v "$seed:/seed" eshu-collector-pagerduty:ci seed --dest /seed
        test -x "$seed/collector"
        cmp "$seed/manifest.yaml" manifest.yaml
        ref="ghcr.io/eshu-hq/eshu-collector-pagerduty@sha256:$(printf 'ab%.0s' $(seq 32))"
        docker run --rm -e COLLECTOR_IMAGE_REF="$ref" -v "$seed:/seed" eshu-collector-pagerduty:ci seed --dest /seed
        [[ "$(cat "$seed/manifest.yaml")" == *"image: $ref"* ]]
        if docker run --rm -v "$seed:/seed" eshu-collector-pagerduty:ci seed --dest /seed --image-ref not-a-digest; then exit 1; fi
        total=$(grep -Ec '^[[:space:]]*image:' manifest.yaml)
        pinned=$(grep -Ec '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+@sha256:[0-9a-f]{64}[[:space:]]*$' manifest.yaml)
        echo "manifest image refs: $pinned/$total digest-pinned"
        [ "$pinned" -ge 1 ] && [ "$pinned" -eq "$total" ]
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_pinned" -eq "$from_total" ]
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
      # Advisory on every event, as the retired lane was; findings ride the
      # SARIF artifact and the Security tab.
      gosec-fail-on-findings: false
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true' }}

  govulncheck-report:
    # The reusable runs contents:read-only, so issue filing stays a caller
    # job and the only holder of issues:write. Every lane runs on schedule,
    # so one combined issue per day: it fires only when go-ci failed on a
    # schedule event and comments instead of duplicating an open one.
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the scheduled findings issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="[ci] scheduled scan findings $(date -u +%F)"
          body="Scheduled CI (govulncheck, gosec, and every other lane) failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits (fork PRs run on a
    # read-only token): non-PR events only, and the only job holding
    # security-events:write. It downloads the gosec-pagerduty artifact the
    # reusable's gosec lane uploads (named gosec-<module>), so it also runs
    # when an unrelated go-ci lane failed.
    needs: [go-ci]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # download the gosec artifact
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gosec-pagerduty
          path: ${{ github.workspace }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif

  ci-complete:
    # changes is listed so a failed path-selection job cannot false-green:
    # its lanes would skip while the failure itself trips the aggregator.
    needs: [changes, go-ci, govulncheck-report, gosec-sarif]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"] per job: comparing whole job OBJECTS to
          # "failure" never matches (false-green), and needs.*.result is a
          # bare ARRAY that kills green runs on AttributeError. Skipped lanes
          # pass; only failure or cancelled fail. Never change this shape
          # without a seeded red proof.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
